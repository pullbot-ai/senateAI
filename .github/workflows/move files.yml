name: Deploy Pages

on:
  push:
    paths:
      - 'index.html'
      - 'chatbot.html'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create .nojekyll
        run: touch .nojekyll
      
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
      - name: Deploy to gh-pages
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          git checkout main -- index.html chatbot.html assets/ .nojekyll
          git add -f index.html chatbot.html assets/ .nojekyll
          git commit -m "Deploy website"
          git push origin gh-pages --force
      
      - name: Remove website files from main
        run: |
          git checkout main
          git stash
          git pull --rebase origin main
          git stash pop || true
          git rm -rf index.html chatbot.html assets/
          git rm -f .nojekyll
          git commit -m "Remove website files - deployed on gh-pages" || echo "No changes"
          
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push successful!"
              exit 0
            fi
            echo "Failed, pulling and retrying..."
            git pull --rebase origin main
            sleep 10
          done
          
          echo "All push attempts failed"
          exit 1
