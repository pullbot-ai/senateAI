name: Ping Training

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pick random topics from ALL topics
        run: |
          ALL_TOPICS=(
            "mathematics" "algebra" "geometry" "calculus" "statistics"
            "physics" "quantum_mechanics" "thermodynamics" "electromagnetism"
            "chemistry" "organic_chemistry" "biochemistry"
            "biology" "genetics" "neuroscience" "microbiology"
            "computer_science" "algorithms" "machine_learning" "cybersecurity" "networking"
            "history" "ancient_civilizations" "world_wars" "medieval_history"
            "geography" "climate_science"
            "astronomy" "astrophysics"
            "philosophy" "logic" "ethics" "epistemology"
            "psychology" "cognitive_science" "behavioral_economics"
            "linguistics" "literature" "poetry"
            "economics" "macroeconomics" "microeconomics"
            "political_science" "law" "constitutional_law"
            "medicine" "anatomy"
            "engineering"
            "music_theory" "art_history" "environmental_science"
          )
          
          SELECTED=()
          while [ ${#SELECTED[@]} -lt 5 ]; do
            RANDOM_TOPIC=${ALL_TOPICS[$RANDOM % ${#ALL_TOPICS[@]}]}
            if [[ ! " ${SELECTED[@]} " =~ " ${RANDOM_TOPIC} " ]]; then
              SELECTED+=("$RANDOM_TOPIC")
            fi
          done
          
          TOPIC_STRING=$(IFS=','; echo "${SELECTED[*]}")
          echo "Pinging: $TOPIC_STRING"
          
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"topics\":\"$TOPIC_STRING\"}}"
      
      - name: Trigger focused training
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/focused_training.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"max_senators\":\"10\",\"epochs\":\"50\"}}"
      
      - name: Trigger anti-overfit training
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/anti_overfit.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"max_senators\":\"10\"}}"
      
      - name: Trigger router training
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_router.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
      
      - name: Trigger critic training
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_critic.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
      
      - name: Trigger Wikipedia scraper
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape_wikipedia.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
