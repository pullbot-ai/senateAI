name: Ping Training

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pick random topics and trigger training
        run: |
          TOPIC_GROUPS=(
            "mathematics,algebra,geometry,calculus,statistics"
            "physics,chemistry,biology,astronomy,environmental_science"
            "computer_science,algorithms,machine_learning,cybersecurity,networking"
            "history,ancient_civilizations,world_wars,geography,philosophy"
            "psychology,economics,political_science,law,linguistics"
            "art_history,music_theory,literature,poetry,ethics"
            "medicine,anatomy,neuroscience,genetics,microbiology"
            "quantum_mechanics,thermodynamics,electromagnetism,organic_chemistry,biochemistry"
            "climate_science,behavioral_economics,cognitive_science,epistemology,constitutional_law"
            "microeconomics,macroeconomics,medieval_history,astrophysics,engineering"
          )
          
          RANDOM_GROUP=${TOPIC_GROUPS[$RANDOM % ${#TOPIC_GROUPS[@]}]}
          echo "Pinging: $RANDOM_GROUP"
          
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"topics\":\"$RANDOM_GROUP\"}}"
      
      - name: Trigger focused training
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/focused_training.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"max_senators\":\"10\",\"epochs\":\"30\"}}"
      
      - name: Trigger router training
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_router.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
      
      - name: Trigger critic training
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_critic.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
      
      - name: Trigger Wikipedia scraper
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape_wikipedia.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
