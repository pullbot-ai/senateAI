name: Ask Senator

on:
  workflow_dispatch:
    inputs:
      senator_id:
        description: 'Senator ID to ask'
        required: true
        type: number
      question:
        description: 'Question to ask'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo apt-get clean
      
      - name: Get senator's bundle ID
        id: bundle
        run: |
          BUNDLE=$(( ${{ github.event.inputs.senator_id }} / 10 ))
          BUNDLE_PADDED=$(printf "%03d" $BUNDLE)
          echo "bundle_id=$BUNDLE_PADDED" >> $GITHUB_OUTPUT
          echo "Senator ${{ github.event.inputs.senator_id }} is in bundle $BUNDLE_PADDED"
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/
            senate_bundles/senate_index.json
            senate_bundles/bundle_${{ steps.bundle.outputs.bundle_id }}.pt
            data/wordbank.json
            config.yaml
          sparse-checkout-cone-mode: false
          submodules: false
          lfs: false
          show-progress: false
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      
      - run: pip install torch numpy pyyaml
      
      - name: Ask senator
        run: |
          cat > ask_senator.py << 'EOF'
          import sys, json
          sys.path.insert(0, 'src')
          from model_template import SenateBundle
          from wordbank import get_wordbank
          
          senator_id = ${{ github.event.inputs.senator_id }}
          question = """${{ github.event.inputs.question }}"""
          
          bundle_id = senator_id // 10
          bundle_path = f'senate_bundles/bundle_{bundle_id:03d}.pt'
          
          print(f'Loading senator {senator_id} from bundle {bundle_id}...')
          bundle = SenateBundle.load(bundle_path)
          senator = bundle.get_senator(senator_id)
          
          if senator is None:
              print(f'Senator {senator_id} not found!')
              sys.exit(1)
          
          wordbank = get_wordbank()
          senator.eval()
          
          print(f'Specialties: {senator.specialties}')
          print(f'Question: {question}')
          print()
          
          tokens = wordbank.tokenize(question, max_len=32)
          input_ids = torch.tensor([tokens])
          
          import torch
          with torch.no_grad():
              generated = []
              current = input_ids
              
              for _ in range(20):
                  logits = senator(current)
                  last_logits = logits[0, -1, :]
                  probs = torch.softmax(last_logits / 0.8, dim=-1)
                  
                  sorted_probs, sorted_indices = torch.sort(probs, descending=True)
                  cumsum = torch.cumsum(sorted_probs, dim=0)
                  cutoff = (cumsum > 0.8).nonzero()[0].item() + 1
                  cutoff = max(cutoff, 3)
                  
                  top_probs = sorted_probs[:cutoff]
                  top_indices = sorted_indices[:cutoff]
                  top_probs = top_probs / top_probs.sum()
                  
                  next_token = top_indices[torch.multinomial(top_probs, 1)].item()
                  
                  if next_token == 2:
                      break
                  
                  generated.append(next_token)
                  current = torch.cat([current, torch.tensor([[next_token]])], dim=1)
          
          answer = wordbank.decode(torch.tensor(generated))
          
          print(f'ANSWER: {answer}')
          print()
          
          # Show performance
          performance = senator.performance
          if performance:
              print('Performance:')
              for topic, score in sorted(performance.items(), key=lambda x: x[1], reverse=True):
                  print(f'  {topic}: {score*100:.1f}/100')
          else:
              print('Performance: No data yet')
          EOF
          python ask_senator.py
