name: Train Critic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      
      - run: pip install pyyaml requests
      
      - name: Train critic
        run: python src/train_critic.py
      
      - name: Push critic data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add -f critic_training/
          git commit -m "Train critic" || echo "No changes"
          git push || {
            git pull --rebase origin main
            git add -f critic_training/
            git commit -m "Train critic retry" || echo "No changes"
            git push
          }
