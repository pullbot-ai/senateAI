  ping-train-all-and-optimize:
    needs: [train-topic-0, train-topic-1, train-topic-2, train-topic-3, train-topic-4]
    runs-on: ubuntu-latest
    steps:
      - name: Continue training loop
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_all.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
      
      - name: Trigger optimize
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/optimize_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
