name: Train Topics Parallel

on:
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated topics'
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  train-bundle-0:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/node
          sudo apt-get clean
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: node-${{ runner.os }}-
      - run: pip install torch numpy pyyaml requests
      - run: npm install @heyputer/puter.js
      - name: Train bundle 0
        run: python src/train.py --topics ${{ github.event.inputs.topics }} --bundle 0 --epochs 3 --lr 0.001
      - name: Upload trained bundle
        uses: actions/upload-artifact@v4
        with:
          name: trained-bundle-0
          path: senate_bundles/bundle_000.pt

