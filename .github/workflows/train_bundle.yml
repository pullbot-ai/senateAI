name: Train Topics Parallel

on:
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated topics'
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  train-topic-0:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/node
          sudo apt-get clean
      
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}
          restore-keys: pip-${{ runner.os }}-
      
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: node-${{ runner.os }}-
      
      - run: pip install torch numpy pyyaml requests
      - run: npm install @heyputer/puter.js
      
      - name: Train topic 1
        run: |
          TOPIC=$(echo "${{ github.event.inputs.topics }}" | cut -d',' -f1)
          python src/train.py --topics $TOPIC --epochs 3 --lr 0.001
      
      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add senate_bundles/
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add senate_bundles/
          git commit -m "Train topic" || echo "No changes"
          git push || {
            git pull --rebase origin main
            git add senate_bundles/
            git commit -m "Train topic retry" || echo "No changes"
            git push
          }

