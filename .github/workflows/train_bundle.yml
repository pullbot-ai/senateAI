  push-priority:
    needs: [train-chunk-0, train-chunk-1, train-chunk-2, train-chunk-3, train-chunk-4]
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download priority bundles
        uses: actions/download-artifact@v4
        with:
          pattern: chunk[0-4]-bundle-*
          merge-multiple: true
          path: senate_bundles/
      - name: Push priority bundles
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --ours senate_bundles/ 2>/dev/null || true
          git add senate_bundles/
          for i in $(seq 0 5 45); do
            end=$((i + 4))
            echo "Pushing bundles $i-$end..."
            for j in $(seq $i $end); do
              padded=$(printf "%03d" $j)
              git add senate_bundles/bundle_${padded}.pt 2>/dev/null || true
            done
            git commit -m "Train priority bundles $(printf '%03d' $i)-$(printf '%03d' $end)" 2>/dev/null || echo "No changes"
            for attempt in $(seq 1 20); do
              if git push; then
                echo "Batch $i-$end pushed (attempt $attempt)!"
                break
              fi
              echo "Retry $attempt/20..."
              git pull --rebase origin main 2>/dev/null || true
              sleep 15
            done
          done

  push-non-priority:
    needs: [train-chunk-5, train-chunk-6, train-chunk-7, train-chunk-8]
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download non-priority bundles
        uses: actions/download-artifact@v4
        with:
          pattern: chunk[5-8]-bundle-*
          merge-multiple: true
          path: senate_bundles/
      - name: Push non-priority bundles
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --ours senate_bundles/ 2>/dev/null || true
          git add senate_bundles/
          for i in $(seq 50 5 85); do
            end=$((i + 4))
            if [ $end -gt 88 ]; then end=88; fi
            echo "Pushing bundles $i-$end..."
            for j in $(seq $i $end); do
              padded=$(printf "%03d" $j)
              git add senate_bundles/bundle_${padded}.pt 2>/dev/null || true
            done
            git commit -m "Train bundles $(printf '%03d' $i)-$(printf '%03d' $end)" 2>/dev/null || echo "No changes"
            for attempt in $(seq 1 20); do
              if git push; then
                echo "Batch $i-$end pushed (attempt $attempt)!"
                break
              fi
              echo "Retry $attempt/20..."
              git pull --rebase origin main 2>/dev/null || true
              sleep 15
            done
          done

  ping-train-all-and-optimize:
    needs: [push-priority, push-non-priority]
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - name: Continue training loop
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_all.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
      - name: Trigger optimize
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/optimize_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
