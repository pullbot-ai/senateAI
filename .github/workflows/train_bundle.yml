  push-all:
    needs: [train-chunk-0, train-chunk-1, train-chunk-2, train-chunk-3, train-chunk-4, train-chunk-5, train-chunk-6, train-chunk-7, train-chunk-8]
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all trained bundles
        uses: actions/download-artifact@v4
        with:
          pattern: chunk*-bundle-*
          merge-multiple: true
          path: senate_bundles/
      
      - name: Calculate best senator and bundle
        run: |
          python -c "
import json, torch
from pathlib import Path

best_senator = None
best_score = 0
bundle_scores = {}

for bundle_file in sorted(Path('senate_bundles').glob('bundle_*.pt')):
    bundle_id = int(bundle_file.stem.split('_')[1])
    bundle = torch.load(bundle_file, map_location='cpu', weights_only=False)
    senators = bundle.get('senators', {})
    
    bundle_total = 0
    bundle_count = 0
    
    for senator_id, data in senators.items():
        config = data.get('config', {})
        performance = config.get('performance', {})
        avg_score = sum(performance.values()) / len(performance) * 100 if performance else 0
        
        bundle_total += avg_score
        bundle_count += 1
        
        if avg_score > best_score:
            best_score = avg_score
            best_senator = {
                'id': senator_id,
                'bundle': bundle_id,
                'score': round(avg_score, 1),
                'specialties': config.get('specialties', [])
            }
    
    if bundle_count > 0:
        bundle_scores[bundle_id] = round(bundle_total / bundle_count, 1)

best_bundle = max(bundle_scores, key=bundle_scores.get) if bundle_scores else None

print()
print('='*60)
print('  TRAINING RESULTS')
print('='*60)
if best_senator:
    print(f'  Best Senator: #{best_senator[\"id\"]} (Bundle {best_senator[\"bundle\"]})')
    print(f'  Score: {best_senator[\"score\"]}/100')
    print(f'  Specialties: {\", \".join(best_senator[\"specialties\"][:3])}')
if best_bundle is not None:
    print(f'  Best Bundle: {best_bundle} (Avg: {bundle_scores[best_bundle]}/100)')
print(f'  Total bundles scored: {len(bundle_scores)}')
print('='*60)
"

      - name: Push everything
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --ours senate_bundles/ 2>/dev/null || true
          git add senate_bundles/
          
          for i in $(seq 0 10 80); do
            end=$((i + 9))
            if [ $end -gt 88 ]; then end=88; fi
            
            echo "Pushing bundles $i-$end..."
            
            for j in $(seq $i $end); do
              padded=$(printf "%03d" $j)
              git add senate_bundles/bundle_${padded}.pt 2>/dev/null || true
            done
            
            git commit -m "Train bundles $(printf '%03d' $i)-$(printf '%03d' $end)" 2>/dev/null || echo "No changes"
            
            for attempt in 1 2 3; do
              if git push; then
                echo "Batch $i-$end pushed!"
                break
              fi
              echo "Retrying batch $i-$end..."
              git pull --rebase origin main 2>/dev/null || true
              sleep 10
            done
          done

  ping-train-all-and-optimize:
    needs: [push-all]
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
      - name: Continue training loop
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/train_all.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
      - name: Trigger optimize
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/optimize_bundle.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
