name: Setup Punctuator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo apt-get clean
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/punctuator.py
            requirements.txt
          sparse-checkout-cone-mode: false
          submodules: false
          lfs: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-punctuator
          restore-keys: hf-${{ runner.os }}-
      - run: pip install torch transformers
      - name: Import punctuator model
        run: |
          cat > load_punct.py << 'EOF'
          from transformers import AutoTokenizer, AutoModelForTokenClassification

          MODEL_NAME = "felflare/restore-punctuation-capitalization"

          print("Downloading punctuator model...")
          model = AutoModelForTokenClassification.from_pretrained(MODEL_NAME)
          tokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)

          model.save_pretrained("models/punctuator/model")
          tokenizer.save_pretrained("models/punctuator/tokenizer")
          print("Model saved to models/punctuator/")
          EOF
          python load_punct.py
      - name: Push model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add models/punctuator/ 2>/dev/null || true
          git add load_punct.py
          git commit -m "Import punctuator model" || echo "No changes"
          git push || {
            git pull --rebase origin main
            git add models/punctuator/ 2>/dev/null || true
            git add load_punct.py
            git commit -m "Import punctuator retry" || echo "No changes"
            git push
          }
