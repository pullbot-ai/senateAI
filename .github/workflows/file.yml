name: Setup Punctuator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo apt-get clean
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/punctuator.py
            requirements.txt
          sparse-checkout-cone-mode: false
          submodules: false
          lfs: false
          show-progress: false
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-punctuator
          restore-keys: hf-${{ runner.os }}-
      
      - run: pip install torch transformers
      
      - name: Download and cache punctuator model
        run: python -c "
from punctuator import load_punctuator
model, tokenizer = load_punctuator()
if model:
    print('Punctuator ready!')
else:
    print('Failed to load punctuator')
"
      
      - name: Push cached model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Copy model to repo for pushing
          mkdir -p models/punctuator
          cp -r models/punctuator/* models/punctuator/ 2>/dev/null || true
          
          git add models/punctuator/ 2>/dev/null || true
          git commit -m "Add punctuator model" || echo "No changes"
          git push || echo "Push failed"
