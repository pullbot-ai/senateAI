name: Backend B

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend A"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/backend.js
            questions.json
            debate_results.json
          sparse-checkout-cone-mode: false
          submodules: false
          lfs: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/backend.js
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add questions.json debate_results.json 2>/dev/null || true
          git commit -m "Backend B update" || echo "No changes"
          git push || echo "Push failed"
      - name: Ping Backend A
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/backend_a.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
