<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senate AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                #0a0a0f 0%,
                #1a1a2e 20%,
                #16213e 40%,
                #2E5090 55%,
                #265EF7 70%,
                #16213e 85%,
                #0a0a0f 100%
            );
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Overlay for readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.3);
            z-index: 1;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        /* Icon with glow */
        .icon-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            animation: float 6s ease-in-out infinite;
        }

        .icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22%;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 60px rgba(38, 94, 247, 0.6);
        }

        /* Glow pulses */
        .glow {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border-radius: 30%;
            background: radial-gradient(
                circle,
                rgba(38, 94, 247, 0.5) 0%,
                rgba(46, 80, 144, 0.3) 40%,
                transparent 70%
            );
            animation: pulse 3s ease-in-out infinite;
            z-index: 1;
        }

        .glow-2 {
            animation-delay: 1.5s;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Title */
        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #8ab4ff 50%, #265EF7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Tagline */
        .tagline {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #265EF7, #2E5090);
            color: white;
            box-shadow: 0 8px 32px rgba(38, 94, 247, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(38, 94, 247, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #8ab4ff;
        }

        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .icon-wrapper {
                width: 120px;
                height: 120px;
            }
            
            .tagline {
                font-size: 1rem;
                padding: 0 20px;
            }
            
            .stats {
                gap: 20px;
            }
            
            .stat-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>
    
    <div class="content">
        <div class="icon-wrapper">
            <div class="glow"></div>
            <div class="glow glow-2"></div>
            <img src="assets/icon.png" alt="Senate AI Icon">
        </div>
        
        <h1>Senate AI</h1>
        
        <p class="tagline">
            Where thousands of tiny AI minds debate to find truth.
            A democratic parliament of specialized models working together.
        </p>
        
        <div class="buttons">
            <a href="chatbot.html" class="btn btn-primary">Start Debate</a>
            <a href="https://github.com/pullbot-ai/senateAI" class="btn btn-secondary">View on GitHub</a>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number">4,005</div>
                <div class="stat-label">Senators</div>
            </div>
            <div class="stat">
                <div class="stat-number">50+</div>
                <div class="stat-label">Specialties</div>
            </div>
            <div class="stat">
                <div class="stat-number">400</div>
                <div class="stat-label">Bundles</div>
            </div>
            <div class="stat">
                <div class="stat-number">1.8M</div>
                <div class="stat-label">Params/Senator</div>
            </div>
        </div>
    </div>
</body>
</html>
