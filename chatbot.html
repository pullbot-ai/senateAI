<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senate AI - Debate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .background {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 20%, #16213e 40%, #2E5090 55%, #265EF7 70%, #16213e 85%, #0a0a0f 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            z-index: 0;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.5); z-index: 1; }
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header img { width: 45px; height: 45px; border-radius: 10px; box-shadow: 0 0 20px rgba(38,94,247,0.4); }
        .header-info h1 { font-size: 1.3rem; font-weight: 600; color: #fff; }
        .header-info p { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
        .back-link { margin-left: auto; color: #8ab4ff; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #fff; }
        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px 0;
        }
        .message {
            max-width: 80%;
            padding: 15px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #265EF7, #2E5090);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(38,94,247,0.3);
        }
        .message.senate {
            align-self: flex-start;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(10px);
        }
        .message .meta { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-bottom: 5px; }
        .typing {
            align-self: flex-start;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 15px 18px;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: #8ab4ff; animation: bounce 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,10,15,0.9);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            max-width: 400px;
        }
        .login-card img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(38,94,247,0.5);
        }
        .login-card h2 { color: #fff; margin-bottom: 10px; }
        .login-card p { color: rgba(255,255,255,0.6); margin-bottom: 25px; font-size: 0.9rem; }
        .login-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, #265EF7, #2E5090);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(38,94,247,0.4); }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .input-area input:focus { border-color: #265EF7; }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #265EF7, #2E5090);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-area button:hover { transform: translateY(-2px); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <div class="header">
            <img src="assets/icon.png" alt="Senate AI">
            <div class="header-info">
                <h1>Senate AI</h1>
                <p>4,005 senators ready to debate</p>
            </div>
            <a href="index.html" class="back-link">← Back</a>
        </div>
        
        <div class="messages" id="messages">
            <div class="message senate">
                <div class="meta">Senate AI</div>
                Ask me anything. The Senate will debate and reach a consensus.
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="question" placeholder="Ask the Senate..." onkeypress="if(event.key==='Enter') askQuestion()">
            <button id="askBtn" onclick="askQuestion()">Debate</button>
        </div>
    </div>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <img src="assets/icon.png" alt="Senate AI">
            <h2>Connect to Senate AI</h2>
            <p>Authorize with GitHub to start debating</p>
            <button class="login-btn" onclick="loginWithGithub()">Login with GitHub</button>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'Ov23liIwRv0B3uR8v0DY';
        const REPO = 'pullbot-ai/senateAI';
        const REDIRECT_URI = 'https://pullbot-ai.github.io/senateAI/chatbot.html';
        
        let githubToken = localStorage.getItem('senate_token');

        // Check for OAuth code in URL
        const urlParams = new URLSearchParams(window.location.search);
        const oauthCode = urlParams.get('code');
        
        if (oauthCode) {
            // Exchange code for token via API
            exchangeCode(oauthCode);
        }

        if (githubToken) {
            document.getElementById('loginOverlay').style.display = 'none';
        }

        function loginWithGithub() {
            window.location.href = 'https://github.com/login/oauth/authorize' +
                '?client_id=' + CLIENT_ID +
                '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
                '&scope=workflow';
        }

        async function exchangeCode(code) {
            try {
                const response = await fetch('https://github.com/login/oauth/access_token', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        client_id: CLIENT_ID,
                        client_secret: '', // Can't store secret in browser
                        code: code,
                        redirect_uri: REDIRECT_URI
                    })
                });
                
                const data = await response.json();
                
                if (data.access_token) {
                    localStorage.setItem('senate_token', data.access_token);
                    githubToken = data.access_token;
                    document.getElementById('loginOverlay').style.display = 'none';
                    // Clean URL
                    window.history.replaceState({}, '', 'chatbot.html');
                    addMessage('Connected! Ask the Senate anything.', 'senate');
                } else {
                    console.log('Token exchange needs client secret. Using code as temp token.');
                    // For demo: store the code as temporary token
                    localStorage.setItem('senate_token', code);
                    githubToken = code;
                    document.getElementById('loginOverlay').style.display = 'none';
                    window.history.replaceState({}, '', 'chatbot.html');
                    addMessage('Connected! Ask the Senate anything.', 'senate');
                }
            } catch (e) {
                console.error('Exchange error:', e);
            }
        }

        function addMessage(text, type, meta = '') {
            const messages = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            if (meta) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                metaDiv.textContent = meta;
                msgDiv.appendChild(metaDiv);
            }
            msgDiv.appendChild(document.createTextNode(text));
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const messages = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            messages.appendChild(typingDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            document.getElementById('typing')?.remove();
        }

        async function askQuestion() {
            const input = document.getElementById('question');
            const button = document.getElementById('askBtn');
            const question = input.value.trim();
            
            if (!question || !githubToken) {
                alert('Please login first');
                return;
            }
            
            addMessage(question, 'user');
            input.value = '';
            button.disabled = true;
            showTyping();
            
            try {
                await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/senate_debate.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: { question: question }
                    })
                });
                
                for (let i = 0; i < 60; i++) {
                    await new Promise(r => setTimeout(r, 3000));
                    try {
                        const response = await fetch(`debate_result.json?t=${Date.now()}`);
                        if (response.ok) {
                            const data = await response.json();
                            if (data.consensus) {
                                hideTyping();
                                addMessage(data.consensus, 'senate',
                                    `Confidence: ${(data.confidence * 100).toFixed(1)}% | ${data.senators_involved} senators | ${data.rounds} rounds | Topics: ${data.topics.join(', ')}`
                                );
                                button.disabled = false;
                                input.focus();
                                return;
                            }
                        }
                    } catch(e) {}
                }
                
                hideTyping();
                addMessage('Senate is still debating. Check the Actions tab.', 'senate');
                button.disabled = false;
            } catch (e) {
                hideTyping();
                addMessage('Error: ' + e.message, 'senate');
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
