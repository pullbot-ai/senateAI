<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senate AI - Democratic AI Parliament</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <meta property="og:image" content="https://pullbot-ai.github.io/senateAI/assets/icon.png">
    <script src="https://unpkg.com/parse@5.0.0/dist/parse.min.js"></script>
    <style>
        :root {
            --bg-primary: #0A0A0F;
            --bg-sidebar: #0D0D14;
            --bg-input: #161622;
            --bg-bubble-bot: #1A1A2E;
            --text-primary: #E8E8F0;
            --text-secondary: #8A8AA0;
            --accent: #265EF7;
            --accent-hover: #3B73FF;
            --border: #1F1F30;
            --glow: #2E5090;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }
        .loader-icon {
            width: 80px; height: 80px; margin-bottom: 24px;
            border-radius: 18px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(38, 94, 247, 0.5);
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }
        .loader-title {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, #fff, #8ab4ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .loader-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; }
        .loader-bar { width: 200px; height: 3px; background: var(--bg-input); border-radius: 2px; overflow: hidden; }
        .loader-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--glow));
            border-radius: 2px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .loader-status { font-size: 12px; color: var(--text-secondary); margin-top: 12px; }
        #sidebar {
            width: 260px; min-width: 260px;
            background: var(--bg-sidebar);
            display: flex; flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            height: 100%;
        }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .sidebar-logo img { width: 32px; height: 32px; border-radius: 8px; }
        .sidebar-logo span {
            font-weight: 700; font-size: 18px;
            background: linear-gradient(135deg, #fff, #8ab4ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .new-chat-btn {
            width: 100%; padding: 10px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .new-chat-btn:hover { background: rgba(38, 94, 247, 0.1); border-color: var(--accent); }
        .sidebar-section {
            padding: 14px 16px 6px;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
        .chat-list-item {
            padding: 10px 12px; border-radius: 8px;
            cursor: pointer; font-size: 13px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background 0.2s;
            margin-bottom: 2px;
        }
        .chat-list-item:hover { background: var(--bg-input); }
        .chat-list-item.active { background: rgba(38, 94, 247, 0.15); }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
        .sidebar-btn {
            width: 100%; padding: 9px 12px;
            background: transparent; color: var(--text-secondary);
            border: none; border-radius: 8px;
            cursor: pointer; font-size: 13px;
            text-align: left;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .sidebar-btn:hover { background: var(--bg-input); color: var(--text-primary); }
        #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
        .top-bar {
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .hamburger { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }
        .top-bar-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .top-bar-title img { width: 24px; height: 24px; border-radius: 6px; }
        .login-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--accent), var(--glow));
            color: #fff;
            border: none; border-radius: 8px;
            cursor: pointer;
            font-size: 13px; font-weight: 600;
            transition: all 0.2s;
        }
        .login-btn:hover { box-shadow: 0 4px 20px rgba(38, 94, 247, 0.4); }
        .chat-container {
            flex: 1; overflow-y: auto;
            padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .welcome-screen {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            flex: 1; text-align: center;
        }
        .welcome-screen.hidden { display: none; }
        .welcome-icon {
            width: 80px; height: 80px;
            border-radius: 18px;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(38, 94, 247, 0.5);
        }
        .welcome-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .welcome-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }
        .suggestion-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; max-width: 600px;
        }
        .suggestion-card {
            padding: 16px;
            background: var(--bg-bubble-bot);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            text-align: left;
        }
        .suggestion-card:hover { border-color: var(--accent); background: rgba(38, 94, 247, 0.08); }
        .messages-container { width: 100%; max-width: 768px; margin: 0 auto; }
        .message { display: flex; padding: 20px 0; gap: 16px; }
        .message-avatar {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: var(--bg-input);
            overflow: hidden;
        }
        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message-avatar.bot { background: linear-gradient(135deg, rgba(38,94,247,0.3), rgba(46,80,144,0.2)); }
        .message-content { line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
        .thinking-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
        .thinking-dots span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s infinite ease-in-out;
        }
        .thinking-dots span:nth-child(1) { animation-delay: 0s; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%,80%,100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .thinking-text { color: var(--text-secondary); font-style: italic; font-size: 13px; }
        .input-container {
            padding: 12px 16px;
            max-width: 768px; margin: 0 auto;
            width: 100%;
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex; gap: 10px;
            background: var(--bg-input);
            border-radius: 14px;
            padding: 6px 6px 6px 18px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(38, 94, 247, 0.15); }
        .input-wrapper input {
            flex: 1; background: none; border: none;
            color: var(--text-primary); font-size: 14px;
            outline: none; padding: 8px 0;
        }
        .input-wrapper input::placeholder { color: var(--text-secondary); }
        .send-btn {
            background: linear-gradient(135deg, var(--accent), var(--glow));
            border: none; color: #fff;
            width: 38px; height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover { box-shadow: 0 4px 15px rgba(38, 94, 247, 0.4); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .input-footer { text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: 8px; }
        .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
        .status-dot.online { background: #22C55E; }
        .status-dot.offline { background: #EF4444; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .toast {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--accent); color: #fff;
            padding: 12px 20px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            z-index: 2000;
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 100; transition: left 0.3s ease; }
            #sidebar.open { left: 0; }
            .suggestion-grid { grid-template-columns: 1fr; }
            .welcome-title { font-size: 24px; }
        }
    </style>
</head>
<body>

<div id="loadingScreen">
    <img src="assets/icon.png" alt="Senate AI" class="loader-icon">
    <div class="loader-title">Senate AI</div>
    <div class="loader-subtitle">Democratic AI Parliament of 4,005 Senators</div>
    <div class="loader-bar"><div class="loader-bar-fill" id="loaderFill"></div></div>
    <div class="loader-status" id="loaderStatus">Loading Senate...</div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo"><img src="assets/icon.png" alt=""><span>Senate AI</span></div>
        <button class="new-chat-btn" onclick="newChat()">+ New Debate</button>
    </div>
    <div class="sidebar-section">Debate History</div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
        <button class="sidebar-btn" onclick="checkStatus()">Senate Status</button>
        <button class="sidebar-btn" onclick="window.open('https://github.com/pullbot-ai/senateAI','_blank')">View on GitHub</button>
    </div>
</div>

<div id="main">
    <div class="top-bar">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <span class="top-bar-title"><img src="assets/icon.png" alt="">Senate AI</span>
        <button class="login-btn" onclick="newChat()">New Debate</button>
    </div>
    <div class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <img src="assets/icon.png" alt="Senate AI" class="welcome-icon">
            <div class="welcome-title">Ask the Senate</div>
            <div class="welcome-subtitle">4,005 specialized senators will debate your question</div>
            <div class="suggestion-grid">
                <div class="suggestion-card" onclick="sendSuggestion('What is the capital of France?')">"What is the capital of France?"</div>
                <div class="suggestion-card" onclick="sendSuggestion('Why does ice float?')">"Why does ice float?"</div>
                <div class="suggestion-card" onclick="sendSuggestion('How do computers work?')">"How do computers work?"</div>
                <div class="suggestion-card" onclick="sendSuggestion('What is machine learning?')">"What is machine learning?"</div>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
    </div>
    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Ask the Senate..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">↗</button>
        </div>
        <div class="input-footer" id="statusFooter"><span class="status-dot" id="statusDot"></span>Connecting...</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
Parse.initialize("XmMg08Lgp5aB8jEPLEdH9c9sBOaTDuBXkKL4QU5l", "XbZO0p0jhN3OdteFOkVA9Be3jJMH7U0uZNTBrorO");
Parse.serverURL = "https://parseapi.back4app.com";

let chats = {};
let currentChatId = null;
let backendOnline = false;

function updateLoader(text, pct) {
    document.getElementById('loaderStatus').textContent = text;
    document.getElementById('loaderFill').style.width = pct + '%';
}

async function init() {
    updateLoader('Connecting to backend...', 20);
    await testBackend();
    updateLoader('Loading chats...', 60);
    loadChatsFromCloud();
    updateLoader('Ready!', 100);
    await new Promise(r => setTimeout(r, 500));
    document.getElementById('loadingScreen').classList.add('hidden');
    updateStatus();
}

async function testBackend() {
    try {
        const result = await Parse.Cloud.run("ping");
        backendOnline = result && result.status === 'ok';
    } catch (e) {
        backendOnline = false;
        console.log('Backend offline:', e.message);
    }
}

function updateStatus() {
    const dot = document.getElementById('statusDot');
    const footer = document.getElementById('statusFooter');
    if (backendOnline) {
        dot.className = 'status-dot online';
        footer.innerHTML = '<span class="status-dot online"></span>Senate Online - ' + Object.keys(chats).length + ' debates';
    } else {
        dot.className = 'status-dot offline';
        footer.innerHTML = '<span class="status-dot offline"></span>Backend offline - check GitHub Actions';
    }
}

function newChat() {
    const id = 'debate_' + Date.now();
    chats[id] = { title: 'New Debate', messages: [], created: Date.now() };
    currentChatId = id;
    renderChatList();
    renderMessages();
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('userInput').focus();
}

function switchChat(id) {
    currentChatId = id;
    renderChatList();
    renderMessages();
}

function renderChatList() {
    const c = document.getElementById('chatList');
    const ids = Object.keys(chats).sort((a,b) => chats[b].created - chats[a].created);
    c.innerHTML = ids.map(id =>
        `<div class="chat-list-item${id === currentChatId ? ' active' : ''}" onclick="switchChat('${id}')">${escapeHtml(chats[id].title || 'New Debate')}</div>`
    ).join('');
}

function renderMessages() {
    const c = document.getElementById('messagesContainer');
    const w = document.getElementById('welcomeScreen');
    if (!currentChatId || !chats[currentChatId] || chats[currentChatId].messages.length === 0) {
        c.innerHTML = '';
        w.classList.remove('hidden');
        return;
    }
    w.classList.add('hidden');
    c.innerHTML = chats[currentChatId].messages.map(msg => {
        const isUser = msg.role === 'user';
        const isThinking = msg.content === '<thinking>';
        const avatar = isUser ? '👤' : '<img src="assets/icon.png" alt="">';
        const content = isThinking
            ? `<div id="${msg.id}"><span class="thinking-dots"><span></span><span></span><span></span></span> <span class="thinking-text">Senate is debating</span></div>`
            : escapeHtml(msg.content);
        return `<div class="message"><div class="message-avatar${isUser ? '' : ' bot'}">${avatar}</div><div class="message-content">${content}</div></div>`;
    }).join('');
    setTimeout(() => {
        document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
    }, 100);
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    
    if (!currentChatId) newChat();
    chats[currentChatId].messages.push({ role: 'user', content: text });
    if (chats[currentChatId].messages.length === 1) chats[currentChatId].title = text.substring(0, 40);
    input.value = '';
    renderMessages();
    renderChatList();
    
    const thinkingId = 'thinking_' + Date.now();
    chats[currentChatId].messages.push({ role: 'assistant', content: '<thinking>', id: thinkingId });
    renderMessages();
    
    const thinkingEl = document.getElementById(thinkingId);
    if (thinkingEl) {
        const phrases = ['Senate is debating', '25 senators reasoning', 'Challenger reviewing', 'Voting in progress', 'Almost there'];
        let pi = 0;
        const interval = setInterval(() => {
            if (thinkingEl.querySelector('.thinking-text')) {
                thinkingEl.querySelector('.thinking-text').textContent = phrases[pi % phrases.length];
                pi++;
            }
        }, 800);
        
        const response = await askSenate(text);
        clearInterval(interval);
        chats[currentChatId].messages = chats[currentChatId].messages.filter(m => m.id !== thinkingId);
        chats[currentChatId].messages.push({ role: 'assistant', content: response });
    }
    renderMessages();
    saveCurrentChat();
    updateStatus();
}

async function askSenate(question) {
    try {
        const result = await Parse.Cloud.run("askSenate", { question: question });
        
        if (result.error) {
            return result.error;
        }
        
        if (result.consensus) {
            return `${result.consensus}\n\nConfidence: ${(result.confidence * 100).toFixed(1)}% | ${result.senators_involved} senators | ${result.rounds} rounds\nTopics: ${result.topics.join(', ')}`;
        }
        
        return 'The Senate could not reach a consensus.';
    } catch (e) {
        return 'Error: ' + e.message;
    }
}

function sendSuggestion(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function checkStatus() {
    const parts = [];
    parts.push(backendOnline ? '✅ Backend online' : '❌ Backend offline');
    parts.push(Object.keys(chats).length + ' debates');
    showToast(parts.join(' | '));
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.transform = 'translateY(0)';
    t.style.opacity = '1';
    setTimeout(() => {
        t.style.transform = 'translateY(100px)';
        t.style.opacity = '0';
    }, 3000);
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

async function saveCurrentChat() {
    if (!currentChatId || !chats[currentChatId]) return;
    try {
        await Parse.Cloud.run("saveChat", {
            title: chats[currentChatId].title,
            messages: chats[currentChatId].messages
        });
    } catch (e) {
        console.log('Save chat failed:', e.message);
    }
}

async function loadChatsFromCloud() {
    try {
        const cloudChats = await Parse.Cloud.run("getChats");
        cloudChats.forEach(c => {
            if (!chats[c.id]) {
                chats[c.id] = { title: c.title, messages: c.messages, created: new Date(c.created).getTime() };
            }
        });
        renderChatList();
    } catch (e) {
        console.log('Load chats failed:', e.message);
    }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
